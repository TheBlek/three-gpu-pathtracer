<!DOCTYPE html>
<html>
	<head>
		<title>Path tracing benchmarking</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

		<style>
			html, body {
				margin: 0;
				padding: 0;
				background-color: #111;
				color: #eee;
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			}

			#results {
				box-sizing: border-box;
				display: flex;
				flex-direction: column;
				gap: 12px;
				max-width: 960px;
				margin: 24px;
			}

			#results:empty {
				display: none;
			}

			#results .card {
				box-sizing: border-box;
				padding: 16px;
				line-height: 1.5;
				font-size: 13px;
				white-space: pre-wrap;
				background: #1a1a1a;
				border: 1px solid #333;
			}

			#results .header {
				margin: 0 0 4px;
				color: #aaa;
			}

			#results .credit {
				margin: 0 0 12px;
				color: #777;
				font-size: 12px;
			}

			#results .credit a {
				color: #999;
			}

			#results .card-body {
				display: flex;
				gap: 16px;
				align-items: flex-start;
			}

			#results .data {
				flex: 1;
				min-width: 0;
			}

			#results .run {
				margin: 2px 0;
			}

			#results .summary {
				margin: 12px 0 0;
				padding: 10px 0 0;
				border-top: 1px solid #333;
				color: #cfcfcf;
			}

			#results .error {
				color: #f66;
			}

			#results .preview-link {
				flex-shrink: 0;
				line-height: 0;
				background-color: #111;
				background-image:
					linear-gradient(45deg, #222 25%, transparent 25%),
					linear-gradient(-45deg, #222 25%, transparent 25%),
					linear-gradient(45deg, transparent 75%, #222 75%),
					linear-gradient(-45deg, transparent 75%, #222 75%);
				background-size: 20px 20px;
				background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
			}

			#results .preview {
				display: block;
				width: 280px;
			}
		</style>

	</head>
	<body>
		<div id="results"></div>
		<script src="./benchmark.js" type="module" defer></script>
	</body>
</html>
